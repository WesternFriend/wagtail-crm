<fieldset data-name-part><legend data-part-label>Name part {{ forloop.counter }}</legend>
  <label>Part type <select aria-label="Part type" name="{{ widget.name }}_kind" data-part-kind{% include 'wagtail_crm/widgets/contact_name_attrs.html' %}>
    {% if kind != "given" and kind != "surname" and kind != "surname2" and kind != "separator" %}<option value="{{ kind }}" selected>Unsupported part: {{ kind }}</option>{% endif %}
    {% for key, label in widget.kinds %}<option value="{{ key }}"{% if key == kind %} selected{% endif %}>{{ label }}</option>{% endfor %}
  </select></label>
  <label>Part value <textarea aria-label="Part value" rows="1" name="{{ widget.name }}_value" data-part-value{% include 'wagtail_crm/widgets/contact_name_attrs.html' %}>{{ value }}</textarea></label>
  <button type="button" class="button button-small button-secondary"{% if widget.attrs.disabled %} disabled{% endif %} data-move-up>Move up</button>
  <button type="button" class="button button-small button-secondary"{% if widget.attrs.disabled %} disabled{% endif %} data-move-down>Move down</button>
  <button type="button" class="button button-small button-secondary"{% if widget.attrs.disabled %} disabled{% endif %} data-remove-part>Remove part</button>
</fieldset>
